<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Michel Foucault's Bibliography - Docsify</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A comprehensive bibliography of Michel Foucault's works and secondary literature" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%23333'>F</text></svg>">

  <!-- Docsify Styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />

  <!-- Custom styling -->
  <style>
    :root {
      --base-font-size: 16px;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --accent-color: #2c3e50;
      --text-color: #2c3e50;
      --border-color: #ddd;
      --sidebar-width: 280px;
      --code-bg-color: #f4f4f4;
    }

    body {
      font-family: var(--font-family);
      line-height: 1.6;
    }

    .sidebar {
      background-color: #f8f9fa;
      border-right: 1px solid var(--border-color);
    }

    .sidebar nav ul {
      padding-left: 0;
    }

    .sidebar nav ul li {
      list-style: none;
    }

    .sidebar nav a {
      color: var(--text-color);
      text-decoration: none;
      display: block;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .sidebar nav a:hover {
      background-color: #e8e8e8;
      color: var(--accent-color);
    }

    .sidebar nav a.active {
      background-color: var(--accent-color);
      color: white;
      font-weight: 600;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: var(--text-color);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .markdown-section h1 {
      font-size: 2rem;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 0.5rem;
    }

    .markdown-section h2 {
      font-size: 1.5rem;
    }

    .markdown-section code {
      background-color: var(--code-bg-color);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-size: 0.95em;
    }

    .markdown-section pre {
      background-color: #272822;
      color: #f8f8f2;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--accent-color);
      padding-left: 1rem;
      color: #666;
      margin-left: 0;
    }

    .keyword-tag {
      display: inline-block;
      background-color: #e8f4f8;
      color: var(--accent-color);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.9rem;
      margin: 0.25rem 0.25rem 0.25rem 0;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .keyword-tag:hover {
      background-color: var(--accent-color);
      color: white;
    }

    .export-button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .export-button:hover {
      background-color: #34495e;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      :root {
        --text-color: #e0e0e0;
        --border-color: #333;
        --code-bg-color: #2d2d2d;
      }

      body {
        background-color: #1e1e1e;
        color: var(--text-color);
      }

      .sidebar {
        background-color: #2d2d2d;
        border-right-color: var(--border-color);
      }

      .sidebar nav a {
        color: var(--text-color);
      }

      .sidebar nav a:hover {
        background-color: #3a3a3a;
      }

      .markdown-section {
        color: var(--text-color);
      }

      .markdown-section code {
        background-color: var(--code-bg-color);
        color: #f8f8f2;
      }

      .markdown-section blockquote {
        color: #a0a0a0;
      }

      .keyword-tag {
        background-color: #1a3a3a;
        color: #64b5f6;
      }

      .keyword-tag:hover {
        background-color: #2c3e50;
        color: white;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    // Docsify configuration
    window.$docsify = {
      name: "Michel Foucault's Bibliography",
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      autoHeader: false,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      maxLevel: 3,
      subMaxLevel: 3,
      coverpage: false,
      logo: null,

      // Search configuration
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'No results found.',
        depth: 3,
        hideOtherSidebarContent: false,
        namespace: 'foucault-bibliography'
      },

      // Styling
      themeColor: '#2c3e50',

      // Plugins configuration
      plugins: [
        function(hook, vm) {
          let currentFrontmatter = {};

          hook.beforeEach(function(html) {
            // Extract frontmatter and set meta tags
            const frontmatterMatch = html.match(/^---\n([\s\S]*?)\n---/);
            if (frontmatterMatch) {
              currentFrontmatter = parseFrontmatter(frontmatterMatch[1]);
              injectMetaTags(currentFrontmatter);
            } else {
              currentFrontmatter = {};
            }

            // Remove frontmatter from display
            html = html.replace(/^---\n[\s\S]*?\n---\n/, '');

            return html;
          });

          hook.afterEach(function(html) {
            // Add export button at the end of each page if frontmatter exists
            if (Object.keys(currentFrontmatter).length > 0) {
              const exportBtn = createExportButton(currentFrontmatter);
              html += exportBtn;
            }

            return html;
          });
        }
      ]
    };

    function parseFrontmatter(text) {
      const lines = text.split('\n');
      const frontmatter = {};
      lines.forEach(line => {
        // key: "quoted value" | 'quoted value' | bare value
        // Quoted forms are matched whole, so apostrophes and colons inside a
        // title (L'Ordre du Discours, "Tome 2: L'Usage des plaisirs") survive.
        const match = line.match(/^\s*([A-Za-z_][\w-]*)\s*:\s*(?:"([^"]*)"|'([^']*)'|(.*?))\s*$/);
        if (match) {
          const value = match[2] !== undefined ? match[2]
                      : match[3] !== undefined ? match[3]
                      : match[4];
          frontmatter[match[1]] = (value || '').trim();
        }
      });
      return frontmatter;
    }

    function injectMetaTags(frontmatter) {
      // Remove existing citation meta tags
      const existingMetas = document.querySelectorAll('meta[name^="citation_"]');
      existingMetas.forEach(meta => meta.remove());

      // Highwire Press meta tags for Zotero import
      const tags = {
        'citation_title': frontmatter.title,
        'citation_author': frontmatter.author,
        'citation_publication_date': frontmatter.date,
        'citation_public_url': frontmatter.url,
        'citation_pdf_url': frontmatter.pdf_url || '',
        'citation_abstract': frontmatter.abstract || ''
      };

      Object.entries(tags).forEach(([name, content]) => {
        if (content) {
          const meta = document.createElement('meta');
          meta.name = name;
          meta.content = content;
          document.head.appendChild(meta);
        }
      });
    }

    // Prepare a value for use inside onclick="downloadRIS('...', '...')".
    // JS-string escaping first (the value ends up inside single quotes), then
    // HTML escaping (it ends up inside a double-quoted attribute). Newlines
    // become a literal \n escape, since a raw line break inside a JS string
    // literal is a syntax error and would kill the handler.
    function forInlineHandler(text) {
      return String(text === undefined || text === null ? '' : text)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r?\n/g, '\\n')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;');
    }

    function createExportButton(frontmatter) {
      const risContent = forInlineHandler(generateRIS(frontmatter));
      const escapedTitle = forInlineHandler(frontmatter.title || 'reference');
      const button = `
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ddd;">
          <button class="export-button" onclick="downloadRIS('${escapedTitle}', '${risContent}')">
            📥 Export to Zotero (.ris)
          </button>
        </div>
      `;
      return button;
    }

    function generateRIS(frontmatter) {
      const type = frontmatter.type === 'primary' ? 'BOOK' : 'JOUR';
      const date = frontmatter.date || '';

      let ris = `TY  - ${type}\n`;
      ris += `TI  - ${frontmatter.title}\n`;
      if (frontmatter.author) ris += `AU  - ${frontmatter.author}\n`;
      if (date) ris += `PY  - ${date.substring(0, 4)}\n`;
      if (frontmatter.url) ris += `UR  - ${frontmatter.url}\n`;
      ris += `ER  - \n`;

      return ris;
    }

    function downloadRIS(filename, content) {
      // content arrives already unescaped: the JS parser resolved the \n and \'
      // escapes when it parsed the onclick handler.
      const element = document.createElement('a');
      const safeName = filename.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(content));
      element.setAttribute('download', (safeName || 'reference') + '.ris');
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Docsify plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
