<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Michel Foucault's Bibliography - Docsify</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bibliografia das obras de Michel Foucault e da fortuna crítica sobre seu pensamento, de 1954 até hoje" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%23333'>F</text></svg>">

  <!-- Tipografia do tema Read the Docs, no mesmo CDN que o Docsify já usa -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lato@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lato@5/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lato@5/400-italic.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto-slab@5/700.css">

  <!-- Base do Docsify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />

  <!-- Tema Read the Docs deste projeto -->
  <link rel="stylesheet" href="theme.css" />

  <!-- Aplica o tema salvo antes da primeira pintura, para nao piscar -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('foucault-tema');
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* localStorage bloqueado: segue a preferencia do sistema */ }
    })();
  </script>
</head>
<body>
  <button class="alternador-tema" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema">🌗</button>

  <div id="app">Carregando...</div>

  <script>
    // Alternador claro/escuro. Sem escolha salva, o site segue o sistema.
    (function () {
      var CHAVE = 'foucault-tema';
      var raiz = document.documentElement;
      var botao = document.querySelector('.alternador-tema');

      function sistemaPrefereEscuro() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      function escuroAgora() {
        var forcado = raiz.getAttribute('data-theme');
        if (forcado === 'dark') return true;
        if (forcado === 'light') return false;
        return sistemaPrefereEscuro();
      }

      function pintarBotao() {
        var escuro = escuroAgora();
        botao.textContent = escuro ? '☀' : '🌙';
        botao.setAttribute('aria-pressed', String(escuro));
        botao.title = escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro';
      }

      botao.addEventListener('click', function () {
        var proximo = escuroAgora() ? 'light' : 'dark';
        raiz.setAttribute('data-theme', proximo);
        try { localStorage.setItem(CHAVE, proximo === 'dark' ? 'escuro' : 'claro'); } catch (e) {}
        pintarBotao();
      });

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', pintarBotao);
      }

      pintarBotao();
    })();
  </script>

  <script>
    // Docsify configuration
    window.$docsify = {
      name: "Michel Foucault's Bibliography",
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      autoHeader: false,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      maxLevel: 3,
      subMaxLevel: 2,
      coverpage: false,
      logo: null,

      // Search configuration
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar...',
        noData: 'Nenhum resultado encontrado.',
        depth: 3,
        hideOtherSidebarContent: false,
        namespace: 'foucault-bibliography'
      },

      // Styling
      themeColor: '#2c3e50',

      // Plugins configuration
      plugins: [
        function(hook, vm) {
          let currentFrontmatter = {};

          hook.beforeEach(function(html) {
            // Extract frontmatter and set meta tags
            const frontmatterMatch = html.match(/^---\n([\s\S]*?)\n---/);
            if (frontmatterMatch) {
              currentFrontmatter = parseFrontmatter(frontmatterMatch[1]);
              injectMetaTags(currentFrontmatter);
            } else {
              currentFrontmatter = {};
            }

            // Remove frontmatter from display
            html = html.replace(/^---\n[\s\S]*?\n---\n/, '');

            return html;
          });

          hook.afterEach(function(html) {
            // Add export button at the end of each page if frontmatter exists
            if (Object.keys(currentFrontmatter).length > 0) {
              const exportBtn = createExportButton(currentFrontmatter);
              html += exportBtn;
            }

            return html;
          });
        }
      ]
    };

    function parseFrontmatter(text) {
      const lines = text.split('\n');
      const frontmatter = {};
      lines.forEach(line => {
        // key: "quoted value" | 'quoted value' | bare value
        // Quoted forms are matched whole, so apostrophes and colons inside a
        // title (L'Ordre du Discours, "Tome 2: L'Usage des plaisirs") survive.
        const match = line.match(/^\s*([A-Za-z_][\w-]*)\s*:\s*(?:"([^"]*)"|'([^']*)'|(.*?))\s*$/);
        if (match) {
          const value = match[2] !== undefined ? match[2]
                      : match[3] !== undefined ? match[3]
                      : match[4];
          frontmatter[match[1]] = (value || '').trim();
        }
      });
      return frontmatter;
    }

    function injectMetaTags(frontmatter) {
      // Remove existing citation meta tags
      const existingMetas = document.querySelectorAll('meta[name^="citation_"]');
      existingMetas.forEach(meta => meta.remove());

      // Highwire Press meta tags for Zotero import
      const tags = {
        'citation_title': frontmatter.title,
        'citation_author': frontmatter.author,
        'citation_publication_date': frontmatter.date,
        'citation_public_url': frontmatter.url,
        'citation_pdf_url': frontmatter.pdf_url || '',
        'citation_abstract': frontmatter.abstract || ''
      };

      Object.entries(tags).forEach(([name, content]) => {
        if (content) {
          const meta = document.createElement('meta');
          meta.name = name;
          meta.content = content;
          document.head.appendChild(meta);
        }
      });
    }

    // Prepare a value for use inside onclick="downloadRIS('...', '...')".
    // JS-string escaping first (the value ends up inside single quotes), then
    // HTML escaping (it ends up inside a double-quoted attribute). Newlines
    // become a literal \n escape, since a raw line break inside a JS string
    // literal is a syntax error and would kill the handler.
    function forInlineHandler(text) {
      return String(text === undefined || text === null ? '' : text)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r?\n/g, '\\n')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;');
    }

    function createExportButton(frontmatter) {
      const risContent = forInlineHandler(generateRIS(frontmatter));
      const escapedTitle = forInlineHandler(frontmatter.title || 'reference');
      const button = `
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ddd;">
          <button class="export-button" onclick="downloadRIS('${escapedTitle}', '${risContent}')">
            📥 Exportar para o Zotero (.ris)
          </button>
        </div>
      `;
      return button;
    }

    function generateRIS(frontmatter) {
      const type = frontmatter.type === 'primary' ? 'BOOK' : 'JOUR';
      const date = frontmatter.date || '';

      let ris = `TY  - ${type}\n`;
      ris += `TI  - ${frontmatter.title}\n`;
      if (frontmatter.author) ris += `AU  - ${frontmatter.author}\n`;
      if (date) ris += `PY  - ${date.substring(0, 4)}\n`;
      if (frontmatter.url) ris += `UR  - ${frontmatter.url}\n`;
      ris += `ER  - \n`;

      return ris;
    }

    function downloadRIS(filename, content) {
      // content arrives already unescaped: the JS parser resolved the \n and \'
      // escapes when it parsed the onclick handler.
      const element = document.createElement('a');
      const safeName = filename.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(content));
      element.setAttribute('download', (safeName || 'reference') + '.ris');
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Docsify plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
